name: Build APK
run-name: build ${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      id: { required: true, type: string }
      url: { required: true, type: string }
      name: { required: true, type: string }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Generate project
        env:
          APP_ID: ${{ inputs.id }}
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          python3 template/generate.py
          ICON="builds/${APP_ID}/icon.png"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}; mkdir -p apk/app/src/main/res/mipmap-$n
            convert "$ICON[0]" -resize ${s}x${s}^ -gravity center -extent ${s}x${s} -strip PNG32:apk/app/src/main/res/mipmap-$n/ic_launcher.png
          done
      - name: Build
        working-directory: apk
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          export KS_FILE="$RUNNER_TEMP/ks.p12"
          gradle assembleRelease --no-daemon -q
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ inputs.id }}
          APP_NAME: ${{ inputs.name }}
        run: |
          F="$(echo "$APP_NAME" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-*//;s/-*$//')"; F="${F:-app}.apk"
          cp apk/app/build/outputs/apk/release/app-release.apk "$F"
          gh release create "build-$APP_ID" "$F" --title "$APP_NAME" --notes "$APP_NAME"
